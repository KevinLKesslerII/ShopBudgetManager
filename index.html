<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Shop Budget Dashboard</h1>

    <!-- Add Sales Form -->
    <div>
        <h2>Add Sale</h2>
        <input type="number" id="saleAmount" placeholder="Amount">
        <input type="date" id="saleDate">
        <button onclick="addSale()">Add Sale</button>
    </div>

    <!-- Add Expense Form -->
    <div>
        <h2>Add Expense</h2>
        <input type="text" id="expenseName" placeholder="Expense Name">
        <input type="number" id="expenseAmount" placeholder="Amount">
        <input type="date" id="expenseDate">
        <button onclick="addExpense()">Add Expense</button>
    </div>

    <!-- Fixed Expenses -->
    <div>
        <h2>Fixed Expenses</h2>
        <input type="text" id="fixedExpenseName" placeholder="Fixed Expense Name">
        <input type="number" id="fixedExpenseAmount" placeholder="Amount">
        <button onclick="addFixedExpense()">Add Fixed Expense</button>
    </div>

    <!-- Financial Overview Table -->
    <table>
        <tr>
            <th>Total Sales:</th>
            <td id="totalSales">$0</td>
        </tr>
        <tr>
            <th>Total Expenses:</th>
            <td id="totalExpenses">$0</td>
        </tr>
        <tr>
            <th>Net Income:</th>
            <td id="netIncome">$0</td>
        </tr>
    </table>

    <!-- Monthly and YTD Sales -->
    <table>
        <tr>
            <th>Monthly Sales Total:</th>
            <td id="monthlySales">$0</td>
        </tr>
        <tr>
            <th>Sales YTD:</th>
            <td id="salesYTD">$0</td>
        </tr>
    </table>

    <button onclick="clearAllData()">Clear All Data</button>

    <!-- Links to Detailed Pages -->
    <a href="sales.html">View All Sales</a>
    <a href="expenses.html">View All Expenses</a>

    <script src="script.js"></script>
</body>

</html>
